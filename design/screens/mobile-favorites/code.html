<!-- Main Content Frame -->

<!-- Kicker -->
<div class="h-1 bg-primary w-12 mb-margin-kicker mx-auto md:mx-0"></div>
<section class="flex flex-col gap-6">
<!-- Favorite Item 1 -->
<article class="group border border-warm-sand p-6 bg-surface-container-lowest transition-all hover:border-stone cursor-pointer relative overflow-hidden">
<div class="flex justify-between items-start mb-4">
<div>
<h2 class="font-display-title-mobile text-display-title-mobile text-primary mb-1">水调歌头·明月几时有</h2>
<p class="font-author-subheading-mobile text-author-subheading-mobile text-secondary">苏轼 · 北宋</p>
</div>
<button class="text-error p-2 active:scale-95 transition-transform z-10 relative">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">favorite</span>
</button>
</div>
<p class="font-poem-body-mobile text-poem-body-mobile text-on-surface line-clamp-2">
                    明月几时有？把酒问青天。不知天上宫阙，今夕是何年。我欲乘风归去，又恐琼楼玉宇，高处不胜寒。起舞弄清影，何似在人间。
                </p>
<!-- Subtle Decorative Divider -->
<div class="absolute bottom-0 left-0 w-full h-[1px] bg-gradient-to-r from-transparent via-warm-sand to-transparent"></div>
</article>
<!-- Favorite Item 2 -->
<article class="group border border-warm-sand p-6 bg-surface-container-lowest transition-all hover:border-stone cursor-pointer relative overflow-hidden">
<div class="flex justify-between items-start mb-4">
<div>
<h2 class="font-display-title-mobile text-display-title-mobile text-primary mb-1">声声慢·寻寻觅觅</h2>
<p class="font-author-subheading-mobile text-author-subheading-mobile text-secondary">李清照 · 两宋之交</p>
</div>
<button class="text-error p-2 active:scale-95 transition-transform z-10 relative">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">favorite</span>
</button>
</div>
<p class="font-poem-body-mobile text-poem-body-mobile text-on-surface line-clamp-2">
                    寻寻觅觅，冷冷清清，凄凄惨惨戚戚。乍暖还寒时候，最难将息。三杯两盏淡酒，怎敌他、晚来风急！雁过也，正伤心，却是旧时相识。
                </p>
<div class="absolute bottom-0 left-0 w-full h-[1px] bg-gradient-to-r from-transparent via-warm-sand to-transparent"></div>
</article>
<!-- Favorite Item 3 -->
<article class="group border border-warm-sand p-6 bg-surface-container-lowest transition-all hover:border-stone cursor-pointer relative overflow-hidden">

<div>
<h2 class="font-display-title-mobile text-display-title-mobile text-primary mb-1">念奴娇·赤壁怀古</h2>
<p class="font-author-subheading-mobile text-author-subheading-mobile text-secondary">苏轼 · 北宋</p>
</div>
<button class="text-error p-2 active:scale-95 transition-transform z-10 relative">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">favorite</span>
</button>
</div>
<p class="font-poem-body-mobile text-poem-body-mobile text-on-surface line-clamp-2">
                    大江东去，浪淘尽，千古风流人物。故垒西边，人道是，三国周郎赤壁。乱石穿空，惊涛拍岸，卷起千堆雪。江山如画，一时多少豪杰。
                </p>
<div class="absolute bottom-0 left-0 w-full h-[1px] bg-gradient-to-r from-transparent via-warm-sand to-transparent"></div>
</article>
