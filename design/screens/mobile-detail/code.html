                水调歌头·明月几时有
            </h1>
<div class="flex items-center gap-4 font-author-subheading-mobile text-author-subheading-mobile text-secondary">
<a class="hover:text-primary transition-colors underline decoration-1 underline-offset-4" href="#">苏轼</a>

<a class="hover:text-primary transition-colors underline decoration-1 underline-offset-4" href="#">水调歌头</a>
<span class="text-warm-sand">|</span>
<span>北宋</span>

</div>

<!-- Poem Body -->
<div class="font-poem-body-mobile text-poem-body-mobile text-on-background space-y-6 leading-loose text-justify">
<p class="indent-8">
                丙辰中秋，欢饮达旦，大醉，作此篇，兼怀子由。
            </p>
<p class="indent-8">
                明月几时有？把酒问青天。不知天上宫阙，今夕是何年。我欲乘风归去，又恐琼楼玉宇，高处不胜寒。起舞弄清影，何似在人间。
            </p>
<p class="indent-8">
                转朱阁，低绮户，照无眠。不应有恨，何事长向别时圆？人有悲欢离合，月有阴晴圆缺，此事古难全。但愿人长久，千里共婵娟。
            </p>
</div>
