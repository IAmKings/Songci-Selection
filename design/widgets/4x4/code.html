<!DOCTYPE html>

<html lang="zh-CN"><head>

                      "inverse-surface": "#30312c",
                      "tertiary-fixed-dim": "#c9c7ba",
                      "tertiary": "#212119",

                      "on-background": "#1b1c18",
                      "on-secondary-fixed-variant": "#484742",
                      "on-secondary": "#ffffff",

              },
              "borderRadius": {

                      "lg": "0.5rem",

              },
              "spacing": {
                      "margin-divider": "44px",
                      "frame-padding-desktop": "72px 64px 44px",
                      "margin-title": "12px",

                      "gutter-stanza": "56px",
                      "section-gap": "34px",
                      "frame-padding-mobile": "40px 30px 28px"
              },
              "fontFamily": {
                      "display-title": ["'Noto Serif SC'", "serif"],
                      "poem-body": ["'Noto Serif SC'", "serif"],

                      "label-metadata": ["'Inter'", "sans-serif"],

<style>
        /* Writing Mode for traditional vertical text */
        .vertical-text {
            writing-mode: vertical-rl;
            text-orientation: upright;
        }
        
        /* Parchment texture overlay */
        .parchment-texture {
            background-color: #f5f4ed; /* surface-container-low */
            position: relative;
        }
        .parchment-texture::before {
            content: "";
            position: absolute;
            inset: 0;
            opacity: 0.4;
            mix-blend-mode: multiply;
            pointer-events: none;
            /* Subtly textured background simulation using css gradients */
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(0,0,0,0.02) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(0,0,0,0.03) 0%, transparent 40%),
                linear-gradient(45deg, rgba(232, 230, 220, 0.3) 25%, transparent 25%, transparent 75%, rgba(232, 230, 220, 0.3) 75%, rgba(232, 230, 220, 0.3)),
                linear-gradient(45deg, rgba(232, 230, 220, 0.3) 25%, transparent 25%, transparent 75%, rgba(232, 230, 220, 0.3) 75%, rgba(232, 230, 220, 0.3));
            background-size: 100% 100%, 100% 100%, 20px 20px, 20px 20px;
            background-position: 0 0, 0 0, 0 0, 10px 10px;
        }
    </style>
</head>
<body class="bg-surface-container-highest flex items-center justify-center min-h-screen p-4">
<!-- Android Widget Container (4x4 roughly translates to a square aspect ratio on many grids, e.g., 320x320 or larger) -->
<!-- We'll use a fixed size container to simulate the widget environment -->
<div class="relative w-[340px] h-[340px] rounded-[28px] overflow-hidden shadow-sm parchment-texture border border-warm-sand flex flex-col" style="background-color: #f5f4ed;">
<!-- The Kicker (Brand Signature) -->
<div class="h-[4px] w-full bg-primary-container absolute top-0 left-0 z-10"></div>
<!-- Widget Header (Brand Logo) -->
<div class="pt-5 px-6 pb-2 flex justify-between items-center z-10">
<span class="font-display-title-mobile text-[24px] font-medium tracking-widest text-[#1B365D]">宋词精选</span>
<!-- Decorative seal/stamp placeholder -->
<div class="w-6 h-6 border border-[#ba1a1a] rounded flex items-center justify-center opacity-80">
<span class="text-[#ba1a1a] text-[10px] font-display-title-mobile leading-none">宋</span>
</div>
</div>
<!-- Main Content Area: Poem & Author -->
<!-- Using a horizontal scroll or tight layout for vertical text, or a clean horizontal layout for readability in a widget -->
<!-- We'll use a traditional vertical layout for the immersive feel -->
<div class="flex-1 flex flex-row-reverse justify-start px-6 pt-2 pb-16 overflow-hidden z-10">
<!-- Title and Author Column -->
<div class="flex flex-col items-center mr-0 ml-6 shrink-0 h-full justify-start pt-2">
<h1 class="vertical-text font-display-title-mobile text-[28px] text-[#1B365D] tracking-widest mb-4">水调歌头</h1>
<div class="w-[1px] h-8 bg-warm-sand mx-auto my-2"></div>
<p class="vertical-text font-author-subheading-mobile text-secondary mt-2">苏轼</p>
</div>
<!-- Poem Stanza Columns -->
<div class="flex flex-row-reverse gap-4 overflow-hidden pt-4">
<p class="vertical-text font-poem-body-mobile text-[#1B365D] leading-relaxed">
                    明月几时有，把酒问青天。<br/>
                    不知天上宫阙，今夕是何年。
                </p>
<div class="w-[1px] h-[80%] bg-warm-sand self-center mx-1"></div>
<p class="vertical-text font-poem-body-mobile text-[#1B365D] leading-relaxed">
                    我欲乘风归去，又恐琼楼玉宇，<br/>
                    高处不胜寒。
                </p>
</div>
</div>
<!-- Bottom Action Bar -->
<div class="absolute bottom-0 w-full h-[52px] bg-surface/80 backdrop-blur-sm border-t border-warm-sand flex justify-between items-center px-4 z-20">
<!-- Refresh Button -->
<button aria-label="Refresh Poem" class="flex items-center justify-center w-10 h-10 rounded-full hover:bg-surface-variant transition-colors text-[#1B365D]">
<span class="material-symbols-outlined" style="font-size: 20px;">refresh</span>
</button>
<!-- Favorite Button -->
<button aria-label="Favorite" class="flex items-center justify-center w-10 h-10 rounded-full hover:bg-surface-variant transition-colors text-[#1B365D]">
<span class="material-symbols-outlined" style="font-size: 20px;">bookmark_border</span>
</button>
<!-- Open App Button -->
<button aria-label="Open App" class="flex items-center justify-center gap-1 h-8 px-3 rounded-full border border-warm-sand hover:bg-[#1B365D] hover:text-white transition-colors text-[#1B365D]">
<span class="font-ui-nav text-[12px]">阅读全文</span>
<span class="material-symbols-outlined" style="font-size: 16px;">open_in_new</span>
</button>
</div>
<!-- Subtle corner decorations -->
<div class="absolute top-2 left-2 w-4 h-4 border-t border-l border-warm-sand opacity-50 z-0"></div>
<div class="absolute top-2 right-2 w-4 h-4 border-t border-r border-warm-sand opacity-50 z-0"></div>
<div class="absolute bottom-16 left-2 w-4 h-4 border-b border-l border-warm-sand opacity-50 z-0"></div>
<div class="absolute bottom-16 right-2 w-4 h-4 border-b border-r border-warm-sand opacity-50 z-0"></div>
</div>
</body></html>
