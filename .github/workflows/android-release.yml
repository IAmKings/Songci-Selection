name: Android Release

# 自动构建 Android APK 并发布到 GitHub Release 供下载。
# 触发方式:
#   1. 手动:仓库 Actions 页 → Android Release → Run workflow
#   2. 打 tag:git tag v0.1.0 && git push origin v0.1.0
# 签名:debug keystore(零配置,可安装);正式上架前需换正式签名。

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write    # 创建/更新 Release
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle (cached)
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK (debug-signed)
        working-directory: app
        # android.injected.signing.* :AGP 命令行注入签名,用 debug keystore 签 release 产物,零 gradle 改动
        run: |
          ./gradlew :composeApp:assembleRelease \
            -Pandroid.injected.signing.store.file=$HOME/.android/debug.keystore \
            -Pandroid.injected.signing.store.password=android \
            -Pandroid.injected.signing.key.alias=androiddebugkey \
            -Pandroid.injected.signing.key.password=android

      - name: Determine version
        id: version
        run: |
          if [ -n "${{ github.ref_name }}" ] && [[ "${{ github.ref_name }}" == v* ]]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=manual-$(date +%Y%m%d-%H%M%S)" >> "$GITHUB_OUTPUT"
          fi

      - name: Stage APK asset
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          mkdir -p dist
          cp app/composeApp/build/outputs/apk/release/composeApp-release.apk "dist/SongciSelection-${TAG}-android.apk"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: SongciSelection ${{ steps.version.outputs.tag }}
          body: |
            Android APK(debug 签名,可直接安装)。

            - 版本:${{ steps.version.outputs.tag }}
            - 构建时间:${{ github.event.repository.updated_at }}
            - 构建编号:${{ github.run_number }}
          draft: ${{ github.ref_type != 'tag' }}   # 手动触发为草稿;tag 触发直接发布
          files: dist/*.apk
